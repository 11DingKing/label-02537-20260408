version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: knowledge_base
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --ngram-token-size=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: kb-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: knowledge_base
      DB_USER: root
      DB_PASS: root123
      UPLOAD_PATH: /data/uploads
    volumes:
      - upload-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend-admin
    container_name: kb-frontend-admin
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  upload-data:
